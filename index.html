    function Nav({ onBook }) {
      const [scrolled, setScrolled] = useState(false);
      const [drawerOpen, setDrawerOpen] = useState(false);

      useEffect(() => {
        const fn = () => setScrolled(window.scrollY > 30);
        window.addEventListener("scroll", fn);
        return () => window.removeEventListener("scroll", fn);
      }, []);

      useEffect(() => {
        const fn = () => { if (window.innerWidth > 760) setDrawerOpen(false); };
        window.addEventListener("resize", fn);
        return () => window.removeEventListener("resize", fn);
      }, []);

      useEffect(() => {
        document.body.style.overflow = drawerOpen ? "hidden" : "";
        return () => { document.body.style.overflow = ""; };
      }, [drawerOpen]);

      const closeDrawer = () => setDrawerOpen(false);

      return (
        <>
          <nav className={`nav ${scrolled ? "scrolled" : ""}`}>

              onClick={() => setDrawerOpen(o => !o)}

    function Marquee() {
      const items = ["Cornetti aus eigener Backstube", "Eier vom Hof Pohl", "Hafermilch ohne Aufpreis", "Hausgerösteter Espresso", "Burrata aus Apulien", "Hundefreundlich"];
      const loop = [...items, ...items];
      return (
        <div className="marquee" aria-hidden="true">
          <div className="marquee-track">
            {loop.map((t, i) => (
              <React.Fragment key={i}><span>{t}</span><span className="sep">✻</span></React.Fragment>
            ))}
          </div>
        </div>
      );
    }

    function useScrollSpy() {
      const [active, setActive] = useState("menu-brunch");
      useEffect(() => {
        const handler = () => {
          const offset = 130;
          let found = MENU_SECTIONS[0].id;
          for (const { id } of MENU_SECTIONS) {
            const el = document.getElementById(id);
            if (!el) continue;
            if (el.getBoundingClientRect().top <= offset) found = id;
          }
          setActive(found);
        };
        window.addEventListener("scroll", handler, { passive: true });
        handler();
        return () => window.removeEventListener("scroll", handler);
      }, []);
      return active;
    }

    function MenuItem({ item, i }) {
      return (
        <div className="menu-item" style={{ animation: `fadeUp .4s ${i * 0.03}s both` }}>
          <div className="menu-item-top">

            <div className="menu-item-price">
              {item.price} €
              {item.priceNote && <span className="menu-item-price-note">{item.priceNote}</span>}
            </div>
          </div>
          {item.desc && <div className="menu-item-desc">{item.desc}</div>}
        </div>
      );
    }

            </div>
          </div>
        </>

    function MenuSection() {
      const active = useScrollSpy();
      const navRef = React.useRef(null);

      React.useEffect(() => {
        if (!navRef.current) return;
        const btn = navRef.current.querySelector('.menu-spy-btn.active');
        if (!btn) return;
        const nav = navRef.current;
        const btnLeft = btn.offsetLeft;
        const btnWidth = btn.offsetWidth;
        const navWidth = nav.offsetWidth;
        nav.scrollTo({ left: btnLeft - navWidth / 2 + btnWidth / 2, behavior: 'smooth' });
      }, [active]);

      const scrollTo = (id) => {
        const el = document.getElementById(id);
        if (!el) return;
        const top = el.getBoundingClientRect().top + window.scrollY - 110;
        window.scrollTo({ top, behavior: "smooth" });
      };

      return (
        <section className="section" id="menu">
          <div className="section-head">
            <h2 className="section-title">Die <em>Karte</em></h2>
          </div>

          <div className="menu-spy-wrap">
            <nav className="menu-spy" ref={navRef}>
              {MENU_SECTIONS.map(({ id, label }) => (
                <button
                  key={id}
                  className={`menu-spy-btn${active === id ? " active" : ""}`}
                  onClick={() => scrollTo(id)}
                >
                  {label}
                </button>
              ))}
            </nav>
          </div>

          <div id="menu-brunch" className="menu-category">
            <div className="menu-cat-header">
              <span className="menu-cat-title">Brunch</span>
              <span className="menu-cat-note">10–16 Uhr</span>
            </div>
            <BrunchSection />
          </div>

          <div id="menu-klassiker" className="menu-category">

              <span className="menu-cat-title">Bussi &amp; Amore Klassiker</span>
            </div>
            <KlassikerSection />

          <div id="menu-spargel" className="menu-category">

              <span className="menu-cat-title">Beelitzer Spargel</span>
              <span className="menu-cat-note">Saisonal</span>
            </div>
            <SpargelSection />

          <div id="menu-dessert" className="menu-category">

            <DessertSection />

              <p className="story-text">Bussi entstand 2021 aus dem Wunsch, einen Ort zu haben, an dem man sich Zeit nimmt. Für Sauerteig, der zweimal über Nacht ruht. Für Eier, deren Hennen wir beim Namen kennen. Für Kaffee, der mehr ist als Koffein.</p>
              <p className="story-text">Wir kochen mit Zutaten aus Berlin und Brandenburg, backen alles selbst und freuen uns, wenn du nach dem dritten Flat White noch sitzen bleibst.</p>
              <div className="story-sig">— Lena &amp; Tobi, Inhaber</div>
            </div>
            <div className="story-imgs">
              <div className="story-img">
                <img src="images/interieur.webp" alt="Das Innere von Bussi &amp; Amore — gedeckte Marmortische, schwarze Holzstühle" loading="lazy" />

              <div className="story-img story-img--small">

            </div>
          </div>
        </section>
      );
    }

        <section className="hours-section" id="hours">
          <div className="hours-grid">
            <div>

              <h2 className="section-title" style={{ marginBottom: 40, lineHeight: 1.39 }}>Wann <em>geöffnet</em></h2>
              <div style={{ overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
                <table className="hours-table">
                  <tbody>
                    {HOURS.map((h, i) => (
                      <tr key={h.day} className={`${i === todayIdx ? "today" : ""} ${h.closed ? "closed" : ""}`}>
                        <td>{h.day}</td><td>{h.time}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
            <div className="hours-info">
              <h3 style={{ color: "var(--sage-dark)" }}>Täglich geöffnet.</h3>
              <button className="btn btn-primary" style={{ marginTop: 20 }} onClick={onBook}>Jetzt reservieren →</button>
            </div>
          </div>
        </section>
      );
    }

    function Gallery() {
      const reelRef = React.useRef(null);
      const drag = React.useRef({ active: false, startX: 0, scrollLeft: 0 });

      const onMouseDown = (e) => {
        drag.current = { active: true, startX: e.pageX, scrollLeft: reelRef.current.scrollLeft };
        reelRef.current.style.cursor = 'grabbing';
      };
      const onMouseMove = (e) => {
        if (!drag.current.active) return;
        e.preventDefault();
        reelRef.current.scrollLeft = drag.current.scrollLeft - (e.pageX - drag.current.startX);
      };
      const onMouseUp = () => {
        drag.current.active = false;
        if (reelRef.current) reelRef.current.style.cursor = 'grab';
      };

      return (
        <section className="gallery-section" id="gallery">
          <div className="section-head" style={{ marginBottom: 0 }}>
            <h2 className="section-title">Bei <em>uns</em></h2>
            <a href="#" style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: ".15em", textTransform: "uppercase", color: "var(--sage-dark)" }}>@bussi_und_amore ↗</a>
          </div>
          <div
            className="gallery-reel"
            ref={reelRef}
            onMouseDown={onMouseDown}
            onMouseMove={onMouseMove}
            onMouseUp={onMouseUp}
            onMouseLeave={onMouseUp}
          >
            <div className="gallery-reel-track">
              {GALLERY_ITEMS.map((item, i) => (
                <div key={i} className="gallery-reel-item">
                  <img src={item.src} alt={item.alt} loading="lazy" draggable="false" />
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="footer">
          <div className="footer-grid">
            <div>
              <div className="footer-logo">Bussi <em>&amp;</em> Amore</div>
              <div className="footer-tagline">Slow brunch · Potsdam · seit 2021</div>
            </div>
            <div><h4>Besuch</h4><ul><li>Brandenburger Str. 41</li><li>14467 Potsdam</li><li>+49 331 1234 5678</li></ul></div>
            <div><h4>Hallo sagen</h4><ul><li><a href="#">ciao@bussi-amore.de</a></li><li><a href="#">Instagram</a></li><li><a href="#">Newsletter</a></li></ul></div>
            <div><h4>Karriere</h4><ul><li><a href="#">Service (m/w/d)</a></li><li><a href="#">Köchin / Koch</a></li><li><a href="#">Aushilfe</a></li></ul></div>
          </div>
          <div className="footer-bottom">
            <span>© 2026 Bussi &amp; Amore GmbH · Potsdam</span>
            <span>Impressum · Datenschutz · AGB</span>
          </div>
        </footer>
      );
    }

    function ReservationModal({ open, onClose }) {
      const [step, setStep] = useState(0);
      const [date, setDate] = useState(null);
      const [time, setTime] = useState(null);
      const [guests, setGuests] = useState(2);
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [notes, setNotes] = useState("");

      const dates = useMemo(() => {
        const arr = [];
        const today = new Date();
        for (let i = 0; i < 12; i++) {
          const d = new Date(today);
          d.setDate(today.getDate() + i);
          const disabled = d.getDay() === 1;
          arr.push({ d, label: d.toLocaleDateString("de-DE", { weekday: "short" }).slice(0, 2), day: d.getDate(), disabled, iso: d.toISOString().slice(0, 10) });
        }
        return arr;
      }, [open]);

      const times = ["09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30"];
      if (!open) return null;

      const reset = () => { setStep(0); setDate(null); setTime(null); setGuests(2); setName(""); setEmail(""); setNotes(""); };
      const close = () => { onClose(); setTimeout(reset, 300); };
      const canNext = (step === 0 && date) || (step === 1 && time) || (step === 2 && guests > 0) || (step === 3 && name && email);
      const stepLabels = ["Datum wählen", "Uhrzeit wählen", "Wie viele Gäste?", "Deine Daten", "Bestätigt"];

      return (
        <div className="modal-overlay" onClick={close}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <button className="modal-close" onClick={close} aria-label="Schließen">×</button>
            {step < 4 && <div className="modal-steps">{[0, 1, 2, 3].map(i => <div key={i} className={`modal-step ${i < step ? "done" : i === step ? "active" : ""}`}></div>)}</div>}
            {step < 4 && (<><div className="modal-eyebrow">Schritt {step + 1} von 4</div><h2>{stepLabels[step].split(" ").length > 1 ? <>{stepLabels[step].split(" ").slice(0, -1).join(" ")} <em>{stepLabels[step].split(" ").slice(-1)[0]}</em></> : stepLabels[step]}</h2></>)}
            {step === 0 && <div className="date-grid">{dates.map(d => <button key={d.iso} className={`date-cell ${date?.iso === d.iso ? "selected" : ""} ${d.disabled ? "disabled" : ""}`} disabled={d.disabled} onClick={() => !d.disabled && setDate(d)}><span className="dow">{d.label}</span><span className="day">{d.day}</span></button>)}</div>}
            {step === 1 && <div className="time-grid">{times.map(t => <button key={t} className={`time-cell ${time === t ? "selected" : ""}`} onClick={() => setTime(t)}>{t}</button>)}</div>}
            {step === 2 && <div><div className="guests-row"><button className="guests-btn" disabled={guests <= 1} onClick={() => setGuests(g => g - 1)}>−</button><div><div className="guests-num">{guests}</div><div className="guests-label">{guests === 1 ? "Person" : "Personen"}</div></div><button className="guests-btn" disabled={guests >= 8} onClick={() => setGuests(g => g + 1)}>+</button></div><div style={{ textAlign: "center", color: "var(--text-light)", fontSize: 13, marginTop: 12 }}>Für mehr als 8 Personen bitte direkt anrufen.</div></div>}
            {step === 3 && <div><div className="form-field"><label>Name</label><input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Vor- und Nachname" /></div><div className="form-field"><label>Email</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="dich@email.de" /></div><div className="form-field"><label>Anmerkungen (optional)</label><textarea value={notes} onChange={e => setNotes(e.target.value)} placeholder="Allergien, Geburtstag, Hund …"></textarea></div></div>}
            {step === 4 && <div className="confirmed"><div className="confirmed-check">✓</div><div className="modal-eyebrow">Reservierung bestätigt</div><h2>Bis <em>bald</em>, {name.split(" ")[0]}.</h2><div className="summary" style={{ textAlign: "left", marginTop: 24 }}><div className="summary-row"><span>Datum</span><span>{date?.d.toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long" })}</span></div><div className="summary-row"><span>Uhrzeit</span><span>{time}</span></div><div className="summary-row"><span>Gäste</span><span>{guests}</span></div><div className="summary-row"><span>Name</span><span>{name}</span></div></div><p style={{ fontSize: 14, color: "var(--text-light)", lineHeight: 1.6 }}>Eine Bestätigung wurde an <strong style={{ color: "var(--bordeaux)" }}>{email}</strong> geschickt.</p><button className="btn btn-primary" style={{ marginTop: 24, width: "100%" }} onClick={close}>Schließen</button></div>}
            {step < 4 && <div className="btn-row">{step > 0 ? <button className="btn btn-ghost" onClick={() => setStep(s => s - 1)}>← Zurück</button> : <span></span>}<button className="btn btn-primary" disabled={!canNext} onClick={() => setStep(s => s + 1)}>{step === 3 ? "Reservieren" : "Weiter →"}</button></div>}
          </div>
        </div>
      );
    }

    function FloatingBookBtn({ onBook }) {
      const [visible, setVisible] = React.useState(false);
      React.useEffect(() => {
        const target = document.querySelector('.hero-ctas');
        if (!target) return;
        const obs = new IntersectionObserver(
          ([entry]) => setVisible(!entry.isIntersecting),
          { threshold: 0 }
        );
        obs.observe(target);
        return () => obs.disconnect();
      }, []);
      return (
        <button
          className={`fab-book${visible ? ' fab-book--visible' : ''}`}
          onClick={onBook}
          aria-label="Tisch reservieren"
        >
          <span className="fab-book-icon">♥</span>
          <span className="fab-book-label">Tisch reservieren</span>
        </button>
      );
    }

    function App() {
      const [bookOpen, setBookOpen] = useState(false);
      return (
        <>
          <Nav onBook={() => setBookOpen(true)} />
          <Hero onBook={() => setBookOpen(true)} />
          <Marquee />
          <MenuSection />
          <Story />
          <HoursSection onBook={() => setBookOpen(true)} />
          <Gallery />
          <Footer />
          <ReservationModal open={bookOpen} onClose={() => setBookOpen(false)} />
          <FloatingBookBtn onBook={() => setBookOpen(true)} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
